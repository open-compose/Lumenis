<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!--
    Cutthulhu application icon: Cthulhu holding a pair of scissors in front
    of NTSC colour bars (SMPTE EG 1 pattern: 75% bars, reverse blue bars,
    -I / white / +Q and PLUGE). Original artwork for this project,
    GPL-3.0-or-later like the rest of the repository. Rendered to PNG, ICO
    and ICNS by scripts/make-icons.py.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="40" y="40" width="944" height="944" rx="190"/>
    </clipPath>
    <radialGradient id="headShade" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8be0a4"/>
      <stop offset="0.55" stop-color="#4fb874"/>
      <stop offset="1" stop-color="#2f8250"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#a9b4c2"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </radialGradient>

    <!-- The figure's outline, used for the dark halo that lifts it off the bars. -->
    <g id="silhouette">
      <path d="M380 590 C250 520 190 430 150 300 C200 330 230 330 260 300 C270 360 300 380 330 370 C330 430 360 470 400 490 Z"/>
      <path d="M644 590 C774 520 834 430 874 300 C824 330 794 330 764 300 C754 360 724 380 694 370 C694 430 664 470 624 490 Z"/>
      <path d="M352 640 C352 560 420 520 512 520 C604 520 672 560 672 640 L690 900 L334 900 Z"/>
      <ellipse cx="512" cy="410" rx="218" ry="205"/>
    </g>
  </defs>

  <!-- NTSC colour bars on a rounded tile. -->
  <g clip-path="url(#tile)">
    <!-- 75% bars -->
    <rect x="40" y="40" width="135" height="636" fill="#c0c0c0"/>
    <rect x="175" y="40" width="135" height="636" fill="#c0c000"/>
    <rect x="310" y="40" width="135" height="636" fill="#00c0c0"/>
    <rect x="445" y="40" width="134" height="636" fill="#00c000"/>
    <rect x="579" y="40" width="135" height="636" fill="#c000c0"/>
    <rect x="714" y="40" width="135" height="636" fill="#c00000"/>
    <rect x="849" y="40" width="135" height="636" fill="#0000c0"/>
    <!-- reverse blue bars -->
    <rect x="40" y="676" width="135" height="76" fill="#0000c0"/>
    <rect x="175" y="676" width="135" height="76" fill="#131313"/>
    <rect x="310" y="676" width="135" height="76" fill="#c000c0"/>
    <rect x="445" y="676" width="134" height="76" fill="#131313"/>
    <rect x="579" y="676" width="135" height="76" fill="#00c0c0"/>
    <rect x="714" y="676" width="135" height="76" fill="#131313"/>
    <rect x="849" y="676" width="135" height="76" fill="#c0c0c0"/>
    <!-- -I, white, +Q, black, PLUGE, black -->
    <rect x="40" y="752" width="169" height="232" fill="#00214c"/>
    <rect x="209" y="752" width="169" height="232" fill="#ffffff"/>
    <rect x="378" y="752" width="168" height="232" fill="#32006a"/>
    <rect x="546" y="752" width="168" height="232" fill="#131313"/>
    <rect x="714" y="752" width="45" height="232" fill="#090909"/>
    <rect x="759" y="752" width="45" height="232" fill="#131313"/>
    <rect x="804" y="752" width="45" height="232" fill="#1d1d1d"/>
    <rect x="849" y="752" width="135" height="232" fill="#131313"/>
  </g>

  <!-- Dark halo around the figure. -->
  <use xlink:href="#silhouette" fill="#0b1510" stroke="#0b1510" stroke-width="44" stroke-linejoin="round"/>
  <g fill="none" stroke="#0b1510" stroke-linecap="round" stroke-linejoin="round" stroke-width="96">
    <path d="M430 560 C415 650 380 700 400 780 C415 840 470 830 455 790"/>
    <path d="M482 575 C475 670 460 740 485 820 C500 870 548 852 530 815"/>
    <path d="M542 575 C550 670 565 740 540 820 C525 870 477 852 494 815"/>
    <path d="M594 560 C609 650 644 700 624 780 C609 840 554 830 569 790"/>
    <path d="M640 690 C690 685 720 660 735 615"/>
    <path d="M384 690 C320 700 290 760 300 820 C306 860 350 860 350 830"/>
  </g>

  <!-- Wings -->
  <g stroke="#14301f" stroke-width="14" stroke-linejoin="round">
    <path d="M380 590 C250 520 190 430 150 300 C200 330 230 330 260 300 C270 360 300 380 330 370 C330 430 360 470 400 490 Z" fill="#2c6b45"/>
    <path d="M644 590 C774 520 834 430 874 300 C824 330 794 330 764 300 C754 360 724 380 694 370 C694 430 664 470 624 490 Z" fill="#2c6b45"/>
    <path d="M370 560 C290 500 240 430 200 340 M640 560 C734 500 784 430 824 340" fill="none" stroke="#3f8a5c" stroke-width="10"/>
  </g>

  <!-- Body -->
  <path d="M352 640 C352 560 420 520 512 520 C604 520 672 560 672 640 L690 900 L334 900 Z"
        fill="#3e9a62" stroke="#14301f" stroke-width="14" stroke-linejoin="round"/>
  <path d="M410 640 C440 610 584 610 614 640" fill="none" stroke="#2f7a4b" stroke-width="10" stroke-linecap="round"/>

  <!-- Left arm, curled -->
  <path d="M384 690 C320 700 290 760 300 820 C306 860 350 860 350 830" fill="none" stroke="#14301f" stroke-width="62" stroke-linecap="round"/>
  <path d="M384 690 C320 700 290 760 300 820 C306 860 350 860 350 830" fill="none" stroke="#4fb874" stroke-width="40" stroke-linecap="round"/>

  <!-- Tentacle beard -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#14301f" stroke-width="66">
      <path d="M430 560 C415 650 380 700 400 780 C415 840 470 830 455 790"/>
      <path d="M482 575 C475 670 460 740 485 820 C500 870 548 852 530 815"/>
      <path d="M542 575 C550 670 565 740 540 820 C525 870 477 852 494 815"/>
      <path d="M594 560 C609 650 644 700 624 780 C609 840 554 830 569 790"/>
    </g>
    <g stroke="#4fb874" stroke-width="44">
      <path d="M430 560 C415 650 380 700 400 780 C415 840 470 830 455 790"/>
      <path d="M482 575 C475 670 460 740 485 820 C500 870 548 852 530 815"/>
      <path d="M542 575 C550 670 565 740 540 820 C525 870 477 852 494 815"/>
      <path d="M594 560 C609 650 644 700 624 780 C609 840 554 830 569 790"/>
    </g>
    <!-- suckers -->
    <g fill="#a6e8bb" stroke="none">
      <circle cx="404" cy="700" r="7"/><circle cx="400" cy="745" r="7"/>
      <circle cx="473" cy="720" r="7"/><circle cx="476" cy="770" r="7"/>
      <circle cx="551" cy="720" r="7"/><circle cx="548" cy="770" r="7"/>
      <circle cx="620" cy="700" r="7"/><circle cx="624" cy="745" r="7"/>
    </g>
  </g>

  <!-- Head -->
  <ellipse cx="512" cy="410" rx="218" ry="205" fill="url(#headShade)" stroke="#14301f" stroke-width="14"/>
  <path d="M360 330 C380 260 440 225 500 222" fill="none" stroke="#b9f2cb" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <!-- brows -->
  <path d="M372 388 C405 352 470 352 492 392" fill="none" stroke="#14301f" stroke-width="22" stroke-linecap="round"/>
  <path d="M652 388 C619 352 554 352 532 392" fill="none" stroke="#14301f" stroke-width="22" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="438" cy="440" rx="50" ry="56" fill="url(#eyeGlow)" stroke="#14301f" stroke-width="12"/>
  <ellipse cx="586" cy="440" rx="50" ry="56" fill="url(#eyeGlow)" stroke="#14301f" stroke-width="12"/>
  <ellipse cx="442" cy="446" rx="11" ry="36" fill="#7a0d0d"/>
  <ellipse cx="582" cy="446" rx="11" ry="36" fill="#7a0d0d"/>
  <circle cx="424" cy="420" r="9" fill="#ffffff"/>
  <circle cx="572" cy="420" r="9" fill="#ffffff"/>

  <!-- Right arm, raising the scissors -->
  <path d="M640 690 C690 685 720 660 735 615" fill="none" stroke="#14301f" stroke-width="62" stroke-linecap="round"/>
  <path d="M640 690 C690 685 720 660 735 615" fill="none" stroke="#4fb874" stroke-width="40" stroke-linecap="round"/>

  <!-- Scissors, open, held up at an angle -->
  <g transform="translate(784 520) rotate(-58)">
    <!-- outline pass -->
    <g fill="#0b1510" stroke="#0b1510" stroke-width="30" stroke-linejoin="round">
      <path d="M0 -14 L190 -70 L200 -58 L10 14 Z"/>
      <path d="M0 14 L190 70 L200 58 L10 -14 Z"/>
      <circle cx="-70" cy="-46" r="46"/>
      <circle cx="-70" cy="46" r="46"/>
    </g>
    <!-- handles (orange-red rings) -->
    <g fill="none" stroke="#ff5a2e" stroke-width="22">
      <circle cx="-70" cy="-46" r="38"/>
      <circle cx="-70" cy="46" r="38"/>
    </g>
    <path d="M-38 -30 L10 -6 M-38 30 L10 6" stroke="#ff5a2e" stroke-width="20" stroke-linecap="round"/>
    <!-- blades -->
    <path d="M0 -14 L190 -70 L200 -58 L10 14 Z" fill="url(#blade)" stroke="#2a3340" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 14 L190 70 L200 58 L10 -14 Z" fill="url(#blade)" stroke="#2a3340" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="6" cy="0" r="13" fill="#5a6676" stroke="#1d242e" stroke-width="5"/>
  </g>

  <!-- tentacle-hand gripping the handle -->
  <circle cx="738" cy="612" r="34" fill="#4fb874" stroke="#14301f" stroke-width="12"/>
</svg>
