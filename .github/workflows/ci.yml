name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_macos:
        description: Also build on GitHub-hosted macOS (billed at 10x)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

# Artifact storage is limited (a private repository's quota is small). Uploads
# expire after a few days, and a full quota does not fail a job: the build,
# tests and packages still run, and the self-hosted jobs keep their package
# for the owner (scripts/keep-build.sh). Only ui-consistency then has nothing
# to compare.

jobs:
  linux:
    name: Linux x64 (system Qt)
    # GitHub-hosted jobs stop when the repository variable HOSTED_CI is off
    # (Actions minutes used up); the self-hosted Mac keeps building.
    if: vars.HOSTED_CI != 'off'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        # Some only run elsewhere (scripts/setup-mac-runner.sh on a Mac).
        run: for f in scripts/*.sh packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Install dependencies
        run: scripts/bootstrap-linux.sh

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/ci/bin/cutthulhu --screenshot shots/1x
          QT_SCALE_FACTOR=2 build/ci/bin/cutthulhu --screenshot shots/2x

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-linux
          path: shots
          if-no-files-found: error

      - name: Package (.deb, .tar.gz, AppImage)
        run: |
          cd build/ci && cpack
          cd ../.. && packaging/linux/make-appimage.sh build/ci

      - name: Installer gate (install, launch, uninstall)
        run: |
          # Qt's Wayland platform plugin is loaded at run time, so the package
          # must ask for it itself (BUILDING.md, "Could not find the Qt
          # platform plugin wayland").
          dpkg-deb -f build/ci/*.deb Recommends | grep -q qt6-wayland
          sudo apt-get install -y ./build/ci/*.deb
          cutthulhu --version
          QT_QPA_PLATFORM=offscreen cutthulhu --smoke-test
          sudo apt-get remove -y cutthulhu
          test ! -e /usr/bin/cutthulhu
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./build/ci/*.AppImage --smoke-test

      - name: AppImage on Wayland
        # A real (headless) Wayland compositor: the AppImage must open its
        # windows natively, with its own xdg-shell plugin (BUILDING.md).
        run: |
          sudo apt-get install -y --no-install-recommends weston
          scripts/check-appimage-wayland.sh build/ci/*.AppImage

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 5
          name: linux-x64
          path: |
            build/ci/*.deb
            build/ci/*.rpm
            build/ci/*.tar.gz
            build/ci/*.AppImage
          if-no-files-found: error

  linux-latest:
    # The newest Ubuntu, with its own compiler and Qt (GCC 15, Qt 6.10):
    # what someone building on a current distribution gets. New warnings
    # and Qt deprecations fail here, as warnings are errors.
    name: Linux x64 (Ubuntu 26.04, newest GCC and Qt)
    if: vars.HOSTED_CI != 'off'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates fonts-dejavu-core

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/bootstrap-linux.sh

      - name: Versions
        run: |
          c++ --version | head -n1
          cmake --version | head -n1
          dpkg-query -W qt6-base-dev

      - name: Configure
        # The bootstrap script must install all of Qt's Wayland support:
        # Ubuntu 26.04 splits it over several packages (BUILDING.md).
        run: |
          cmake --preset ci 2>&1 | tee configure.log
          ! grep -q "Wayland support is incomplete" configure.log

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: AppImage on Wayland
        # Qt 6.10 renamed the Wayland plugin; the AppImage must still carry
        # everything Wayland needs.
        run: |
          apt-get install -y --no-install-recommends curl file weston
          packaging/linux/make-appimage.sh build/ci
          scripts/check-appimage-wayland.sh build/ci/*.AppImage

  macos:
    # macos-14 is the oldest supported toolchain (Xcode 15); macos-26 the
    # newest (Xcode 26, which dropped the AGL framework).
    name: macOS arm64 (${{ matrix.os }})
    # macOS minutes cost ten times Linux ones on a private repository, so
    # development-branch pushes skip it; it runs for main, pull requests and
    # by hand (Actions > CI > Run workflow, or `gh workflow run ci.yml
    # --ref <branch>`; `-f hosted_macos=false` runs only the self-hosted Mac).
    if: vars.HOSTED_CI != 'off' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.hosted_macos))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install build tools
        run: brew install ninja

      - name: Configure
        run: cmake --preset ci-macos

      - name: Build
        run: cmake --build --preset ci-macos

      - name: Test
        run: ctest --preset ci-macos

      - name: Screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=build/ci-macos/bin/Cutthulhu.app/Contents/MacOS/Cutthulhu
          "$app" --screenshot shots/1x
          QT_SCALE_FACTOR=2 "$app" --screenshot shots/2x

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-${{ matrix.os }}
          path: shots
          if-no-files-found: error

      - name: Package (.dmg)
        run: cd build/ci-macos && cpack

      - name: Installer gate (mount, launch, check architecture)
        run: |
          dmg=$(ls build/ci-macos/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse
          app="$mnt/Cutthulhu.app/Contents/MacOS/Cutthulhu"
          lipo -archs "$app" | grep -q arm64
          test -f "$mnt/Cutthulhu.app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          codesign --verify --deep "$mnt/Cutthulhu.app"
          "$app" --version
          "$app" --smoke-test
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 5
          name: macos-arm64-${{ matrix.os }}
          path: build/ci-macos/*.dmg
          if-no-files-found: error

  macos-local:
    # The project owner's Apple Silicon Mac, as a self-hosted runner
    # (scripts/setup-mac-runner.sh): free minutes, so it runs on every push.
    # Turned on by the repository variable MAC_RUNNER = on; set it to off
    # while the Mac is away, or jobs wait for it.
    name: macOS arm64 (self-hosted)
    if: vars.MAC_RUNNER == 'on'
    runs-on: [self-hosted, macOS, ARM64, cutthulhu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (once, kept in the runner's home)
        # Not install-qt-action: the Python it sets up only installs under
        # /Users/runner, the GitHub-hosted runners' home. aqtinstall runs in
        # its own virtual environment instead.
        run: |
          qt="$HOME/Qt/$QT_VERSION/macos"
          if [ ! -d "$qt" ]; then
            python3 -m venv "$HOME/.aqt-venv"
            "$HOME/.aqt-venv/bin/pip" install --quiet --upgrade aqtinstall
            "$HOME/.aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -O "$HOME/Qt"
          fi
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Check build tools
        # Installed by an administrator; the runner's user cannot use brew.
        run: command -v ninja && command -v cmake

      - name: Configure
        run: cmake --preset ci-macos

      - name: Build
        run: cmake --build --preset ci-macos

      - name: Test
        run: ctest --preset ci-macos

      - name: Screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf shots
          app=build/ci-macos/bin/Cutthulhu.app/Contents/MacOS/Cutthulhu
          "$app" --screenshot shots/1x
          QT_SCALE_FACTOR=2 "$app" --screenshot shots/2x

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-macos-self-hosted
          path: shots
          if-no-files-found: error

      - name: Package (.dmg)
        run: |
          rm -f build/ci-macos/*.dmg
          cd build/ci-macos && cpack

      - name: Installer gate (mount, launch, check architecture)
        # The runner has no window server session: no on-screen windows.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dmg=$(ls build/ci-macos/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          app="$mnt/Cutthulhu.app/Contents/MacOS/Cutthulhu"
          lipo -archs "$app" | grep -q arm64
          test -f "$mnt/Cutthulhu.app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          codesign --verify --deep "$mnt/Cutthulhu.app"
          "$app" --version
          "$app" --smoke-test

      - name: Keep the .dmg for the owner to try
        # In the folder set up by "setup-mac-runner.sh builds" (BUILDING.md).
        run: scripts/keep-build.sh build/ci-macos/*.dmg

  windows-local:
    # The owner's Windows PC as a self-hosted runner (scripts/setup-windows-
    # runner.ps1): a service under its own standard user, with Qt in C:\Qt
    # and the Visual Studio Build Tools installed. Turned on by the
    # repository variable WINDOWS_RUNNER = on.
    name: Windows x64 (self-hosted)
    if: vars.WINDOWS_RUNNER == 'on'
    runs-on: [self-hosted, Windows, X64, cutthulhu]
    timeout-minutes: 120
    # Windows PowerShell 5.1, which every Windows has; PowerShell 7 (pwsh)
    # may not be installed.
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 scripts, packaging) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$e"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Qt (installed on the PC)
        shell: powershell
        run: |
          $qt = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path "$qt\bin\qmake.exe")) {
            Write-Host "::error::Qt $env:QT_VERSION is not in C:\Qt: run scripts\setup-windows-runner.ps1 install again"
            exit 1
          }
          "QT_ROOT_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # The runner's user cannot reach the Windows Installer service that
        # validates the .msi (BUILDING.md).
        run: cmake --preset ci -DLUMENIS_WIX_SKIP_VALIDATION=ON

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        shell: powershell
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --preset ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Screenshots
        shell: powershell
        run: |
          Remove-Item -Recurse -Force shots -ErrorAction SilentlyContinue
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          build\ci\bin\cutthulhu.exe --screenshot shots\1x | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '2'
          build\ci\bin\cutthulhu.exe --screenshot shots\2x | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-windows-self-hosted
          path: shots
          if-no-files-found: error

      - name: Package (.msi, .zip)
        shell: powershell
        run: |
          Remove-Item -Force build\ci\*.msi, build\ci\*.zip -ErrorAction SilentlyContinue
          cd build\ci
          cpack
          if ($LASTEXITCODE -ne 0) {
            # WiX's own messages are only in its log.
            Get-ChildItem -Recurse -Filter wix.log _CPack_Packages | ForEach-Object { Get-Content $_.FullName -Tail 60 }
            exit $LASTEXITCODE
          }

      - name: Package gate (.zip, launch)
        # The runner's user may not use the Windows Installer service (error
        # 0x80070005), so the .msi cannot be installed or even unpacked here.
        # The .zip has the same files: unpack it and launch the app. The
        # GitHub-hosted job installs and uninstalls the .msi.
        run: |
          if (-not (Get-ChildItem build\ci\*.msi)) { Write-Error 'no .msi was built'; exit 1 }
          $zip = (Get-ChildItem build\ci\*.zip | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'zip'
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          Expand-Archive -Force $zip $target
          $exe = Get-ChildItem -Recurse -Filter cutthulhu.exe $target | Select-Object -First 1
          if (-not $exe) { Write-Error 'cutthulhu.exe is not in the package'; exit 1 }
          $out = & $exe.FullName --smoke-test | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'smoke-test: ok') { exit 1 }

      - name: Keep the .msi for the owner to try
        # In the folder set up by "setup-windows-runner.ps1 builds"
        # (BUILDING.md), named with the date and commit; the newest five.
        run: |
          $dir = $env:CUTTHULHU_BUILDS
          if (-not $dir) { Write-Host 'CUTTHULHU_BUILDS is not set; nothing kept (see BUILDING.md)'; exit 0 }
          if (-not (Test-Path $dir)) { Write-Host "::warning::$dir is missing; run the setup script's builds command"; exit 0 }
          $msi = Get-ChildItem build\ci\*.msi | Select-Object -First 1
          # The commit from GitHub: the PC may have no git.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = '{0}_{1}_{2}.msi' -f $msi.BaseName, (Get-Date -Format 'yyyy-MM-dd_HHmm'), $sha
          Copy-Item $msi.FullName (Join-Path $dir $name)
          Write-Host "kept $(Join-Path $dir $name)"
          Get-ChildItem (Join-Path $dir '*.msi') | Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 5 | Remove-Item -Force

  linux-local:
    # Ubuntu in WSL on the owner's PC (scripts/setup-wsl-runner.sh), one
    # runner per version, labelled ubuntu-<version>. The repository variable
    # LINUX_RUNNERS lists the versions that have one, e.g. ["24.04","26.04"].
    # The installer gate needs no root: the .deb is unpacked, not installed.
    name: Linux x64 (self-hosted, Ubuntu ${{ matrix.ubuntu }})
    if: vars.LINUX_RUNNERS != ''
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(vars.LINUX_RUNNERS || '[]') }}
    runs-on: [self-hosted, Linux, X64, cutthulhu, 'ubuntu-${{ matrix.ubuntu }}']
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: for f in scripts/*.sh packaging/*/*.sh; do bash -n "$f" || exit 1; done

      - name: Versions
        run: |
          c++ --version | head -n1
          cmake --version | head -n1
          dpkg-query -W qt6-base-dev

      - name: Configure
        run: |
          cmake --preset ci 2>&1 | tee configure.log
          ! grep -q "Wayland support is incomplete" configure.log

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf shots
          build/ci/bin/cutthulhu --screenshot shots/1x
          QT_SCALE_FACTOR=2 build/ci/bin/cutthulhu --screenshot shots/2x

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-linux-self-hosted-${{ matrix.ubuntu }}
          path: shots
          if-no-files-found: error

      - name: Package (.deb, .tar.gz, AppImage)
        run: |
          rm -f build/ci/*.deb build/ci/*.rpm build/ci/*.tar.gz build/ci/*.AppImage
          cd build/ci && cpack
          cd ../.. && packaging/linux/make-appimage.sh build/ci

      - name: Installer gate (unpack, launch)
        run: |
          dpkg-deb -f build/ci/*.deb Recommends | grep -q qt6-wayland
          root=$(mktemp -d)
          dpkg-deb -x build/ci/*.deb "$root"
          "$root/usr/bin/cutthulhu" --version
          QT_QPA_PLATFORM=offscreen "$root/usr/bin/cutthulhu" --smoke-test
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 ./build/ci/*.AppImage --smoke-test

      - name: AppImage on Wayland
        run: scripts/check-appimage-wayland.sh build/ci/*.AppImage

      - name: Keep the AppImage for the owner to try
        # In the folder set up by "setup-wsl-runner.sh builds" (BUILDING.md).
        run: scripts/keep-build.sh build/ci/*.AppImage

  windows:
    name: Windows x64
    if: vars.HOSTED_CI != 'off'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 scripts, packaging) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$e"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --preset ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Screenshots
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          build\ci\bin\cutthulhu.exe --screenshot shots\1x | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '2'
          build\ci\bin\cutthulhu.exe --screenshot shots\2x | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots-windows
          path: shots
          if-no-files-found: error

      - name: Package (.msi, .zip)
        run: cd build/ci && cpack

      - name: Installer gate (install, launch, uninstall)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/ci/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; exit 1 }
          $exe = "$env:ProgramFiles\Cutthulhu\bin\cutthulhu.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse "$env:ProgramFiles\Cutthulhu"; Write-Error 'cutthulhu.exe not installed'; exit 1 }
          $out = & $exe --smoke-test | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'smoke-test: ok') { exit 1 }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Test-Path $exe) { Write-Error 'uninstall left cutthulhu.exe behind'; exit 1 }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 5
          name: windows-x64
          path: |
            build/ci/*.msi
            build/ci/*.zip
          if-no-files-found: error

  ui-consistency:
    # Phase 1 gate 1: every window renders the same on every platform.
    # Linux is the reference; each other platform's screenshots must match it.
    # With HOSTED_CI off it runs on the self-hosted Linux runner in WSL, and
    # that runner's screenshots are the reference.
    name: UI looks the same on all platforms
    needs: [linux, macos, macos-local, windows, windows-local, linux-local]
    if: >-
      ${{ !cancelled()
          && (needs.linux.result == 'success' || needs.linux-local.result == 'success')
          && needs.linux.result != 'failure' && needs.linux-local.result != 'failure'
          && needs.windows.result != 'failure' && needs.windows-local.result != 'failure'
          && needs.macos.result != 'failure' && needs.macos-local.result != 'failure' }}
    runs-on: ${{ vars.HOSTED_CI == 'off' && fromJSON('["self-hosted","Linux","X64","cutthulhu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots

      - name: Pillow
        # scripts/imgdiff.py needs it. The GitHub-hosted runner installs it
        # with pip; the self-hosted one has python3-pil
        # (scripts/setup-wsl-runner.sh).
        run: |
          if ! python3 -c 'import PIL' 2>/dev/null; then
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
              pip install --quiet pillow
            else
              echo "::error::Pillow is missing on this runner: in WSL run 'sudo apt-get install -y python3-pil'"
              exit 1
            fi
          fi

      - name: Compare screenshots with Linux
        # Gate: the text-free images (*.notext.png) must match within 0.5%,
        # so layout, sizes, colours and chrome are identical; text itself
        # differs slightly because each OS has its own font rasteriser.
        # The full images and the widget layouts are compared for
        # information, to explain any failure.
        run: |
          rm -rf diffs
          mkdir -p diffs
          # The GitHub-hosted Linux screenshots, or else the self-hosted ones.
          reference=shots/screenshots-linux
          [ -d "$reference" ] || reference=$(ls -d shots/screenshots-linux-self-hosted-* 2>/dev/null | head -n1)
          # Nothing to compare (uploads failed, e.g. a full artifact quota)
          # must not pass.
          others=$(ls -d shots/screenshots-* 2>/dev/null | grep -vxF "$reference" | wc -l)
          if [ -z "$reference" ] || [ "$others" -eq 0 ]; then
            echo "::error::No screenshots to compare: the uploads failed (see BUILDING.md, artifact storage quota)"
            exit 1
          fi
          echo "Reference: $reference"
          status=0
          for platform in shots/screenshots-*; do
            [ "$platform" = "$reference" ] && continue
            name=${platform#shots/screenshots-}
            echo "=== $name"
            for ref in $(cd "$reference" && find . -name '*.png' | sort); do
              out="diffs/$name-$(echo "$ref" | tr '/' '_' | sed 's/^\._//')"
              case "$ref" in
                *.notext.png) python3 scripts/imgdiff.py "$reference/$ref" "$platform/$ref" --diff "$out" || status=1 ;;
                *)            python3 scripts/imgdiff.py "$reference/$ref" "$platform/$ref" --diff "$out" --max-percent 100 ;;
              esac
            done
            for ref in $(cd "$reference" && find . -name '*.layout.json' | sort); do
              python3 scripts/layoutdiff.py "$reference/$ref" "$platform/$ref" || true
            done
          done
          exit $status

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: screenshot-diffs
          path: diffs
