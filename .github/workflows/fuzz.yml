name: Fuzz

# ROADMAP Phase 3 gate 4: the bin and AAF parsers fuzzed without a crash
# (fuzz/README.md, BUILDING.md "Fuzzing"; the 24-hour gate run passed in 2026).
# Run by hand on GitHub's hosted Linux runner:
#
#   gh workflow run fuzz.yml -f hours=5
#
# A hosted job stops after 6 hours, so one run fuzzes at most 5.5; the corpora
# it grows are kept in the Actions cache and the next run starts where this one
# ended, so a longer campaign is several runs. The time is split between the
# targets (scripts/fuzz.py run). Every target runs for its whole time even after
# a crash, hang or sanitizer report (--keep-going); at the end the failing inputs
# are grouped into problems by their stacks, each problem's stack and smallest
# reproducer (base64) are printed, the failing inputs are uploaded as the
# artifact fuzz-artifacts, and the job fails if there were any.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours of fuzzing in all (at most 5.5), split between the targets
        type: string
        default: '5'
      jobs:
        description: Processes per target (libFuzzer -fork)
        type: string
        default: '2'

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz the interchange parsers (${{ inputs.hours }} h)
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs may run 6 hours: up to 5.5 of fuzzing, with room for the build, seeds and merges.
    timeout-minutes: 355
    env:
      FUZZ_HOME: /home/runner/cutthulhu-fuzz
    steps:
      - name: At most 5.5 hours
        run: |
          awk -v h="${{ inputs.hours }}" 'BEGIN { exit !(h > 0 && h <= 5.5) }' || {
            echo "::error::hours must be more than 0 and at most 5.5 (a hosted job stops after 6 hours)"; exit 1; }

      - uses: actions/checkout@v4

      - name: Dependencies, Clang and libFuzzer
        run: |
          scripts/bootstrap-linux.sh
          sudo apt-get install -y clang libclang-rt-dev || sudo apt-get install -y clang "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)-dev"
          clang++ --version | head -n1
          printf 'extern "C" int LLVMFuzzerTestOneInput(const char*, unsigned long) { return 0; }\n' > "$RUNNER_TEMP/probe.cpp"
          clang++ -fsanitize=fuzzer,address,undefined "$RUNNER_TEMP/probe.cpp" -o "$RUNNER_TEMP/probe"

      - name: The corpora from the last run
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FUZZ_HOME }}/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Interchange corpus
        # The seeds: pyaaf2's and pyavb's test files, downloaded at pinned commits.
        run: python3 scripts/interop-corpus.py fetch --dir "$FUZZ_HOME/interop-corpus"

      - name: Build
        run: python3 scripts/fuzz.py build

      - name: Replay the regression inputs
        run: python3 scripts/fuzz.py replay --seeds fuzz/regressions "$FUZZ_HOME/interop-corpus" > replay.log 2>&1 || { tail -n 60 replay.log; exit 1; }

      - name: Seed
        run: python3 scripts/fuzz.py seed --corpus "$FUZZ_HOME/interop-corpus" --out "$FUZZ_HOME/corpus"

      - name: Fuzz
        run: |
          python3 scripts/fuzz.py run --keep-going --time "${{ inputs.hours }}h" --jobs "${{ inputs.jobs }}" \
            --corpus-dir "$FUZZ_HOME/corpus" --artifacts "$FUZZ_HOME/artifacts" \
            --stats "$FUZZ_HOME/stats.json"

      - name: Keep the corpora for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FUZZ_HOME }}/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: The failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: ${{ env.FUZZ_HOME }}/artifacts
          retention-days: 30
          if-no-files-found: ignore
